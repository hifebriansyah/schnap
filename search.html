<!DOCTYPE html>
<html lang="en-AU">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Instant SKU Search &amp; Electrical Spec Tags | SCHNAP Electric Products</title>
  <meta name="description" content="Instant SKU, part number, and electrical specification tag search across SCHNAP Electric Products." />
  <link rel="icon" href="https://d35gtgjy55l0bn.cloudfront.net/images/logos/169/schnap.png" />
  <link rel="stylesheet" href="assets/css/tokens.css" />
  <link rel="stylesheet" href="assets/css/base.css" />
  <link rel="stylesheet" href="assets/css/catalog.css" />
  <link rel="stylesheet" href="assets/css/checkout.css" />
</head>
<body>
  <!-- Global Sticky Header & 6-Pillar Mega-Menu -->
  <div id="site-shell-header"></div>

  <main>
    <!-- Search & Electrical Spec Tag Header -->
    <section class="catalog-header-banner">
      <div class="container">
        <nav class="breadcrumb-nav" aria-label="Breadcrumb">
          <a href="index.html">Trade Home</a>
          <span>/</span>
          <span id="catalog-breadcrumb-current" style="color:#5D1C25;font-weight:700">SKU &amp; Spec Search</span>
        </nav>

        <div style="display:flex;align-items:flex-end;justify-content:space-between;gap:1rem;flex-wrap:wrap">
          <div>
            <h1 class="section-title" id="catalog-page-title">Catalog SKU &amp; Specification Search</h1>
            <p style="font-size:13px;color:var(--text-secondary);margin-top:4px" id="catalog-page-subtitle">
              Live CS-Cart SKU &amp; keyword results matched across SCHNAP's 29,000+ electrical trade catalog.
            </p>
          </div>
          <span class="badge badge-slate mono" id="catalog-dispatch-chip">
            dispatch=products.search
          </span>
        </div>

        <!-- Electrical Specification Quick-Filter Tags -->
        <div class="subcat-pills-bar" aria-label="Electrical Spec Tag Shortcuts">
          <button type="button" class="subcat-pill" data-spec-tag="rcbo">
            <i data-lucide="zap" data-lucide-size="13"></i>
            <span>6kA RCBOs</span>
          </button>
          <button type="button" class="subcat-pill" data-spec-tag="downlight">
            <i data-lucide="lightbulb" data-lucide-size="13"></i>
            <span>IC-4 LED Downlights</span>
          </button>
          <button type="button" class="subcat-pill" data-spec-tag="cable">
            <i data-lucide="plug" data-lucide-size="13"></i>
            <span>Building Wire &amp; Flex</span>
          </button>
          <button type="button" class="subcat-pill" data-spec-tag="pliers">
            <i data-lucide="wrench" data-lucide-size="13"></i>
            <span>1000V VDE Pliers</span>
          </button>
          <button type="button" class="subcat-pill" data-spec-tag="Clipsal">
            <i data-lucide="tag" data-lucide-size="13"></i>
            <span>Clipsal</span>
          </button>
          <button type="button" class="subcat-pill" data-spec-tag="Hager">
            <i data-lucide="tag" data-lucide-size="13"></i>
            <span>Hager</span>
          </button>
          <button type="button" class="subcat-pill" data-spec-tag="AJAX">
            <i data-lucide="shield-check" data-lucide-size="13"></i>
            <span>AJAX Security</span>
          </button>
          <button type="button" class="subcat-pill" data-spec-tag="contactor">
            <i data-lucide="settings" data-lucide-size="13"></i>
            <span>Industrial Contactors</span>
          </button>
        </div>

        <div class="subcat-pills-bar" id="catalog-subcat-pills" style="display:none"></div>
      </div>
    </section>

    <!-- Main Search Results + Technical Facet Sidebar -->
    <section class="container catalog-layout">
      <aside class="filter-sidebar" aria-label="Search Facet Filters">
        <div class="filter-sidebar-header">
          <strong style="font-size:13px;text-transform:uppercase;letter-spacing:0.04em;display:inline-flex;align-items:center;gap:6px;color:#5D1C25">
            <i data-lucide="filter" data-lucide-size="14"></i>
            <span>Refine Matches</span>
          </strong>
          <button type="button" class="btn btn-ghost btn-sm" id="clear-filters-btn" style="padding:2px 6px;color:#C4121A">
            <i data-lucide="rotate-ccw" data-lucide-size="12"></i>
            <span>Reset All</span>
          </button>
        </div>

        <div id="catalog-facets-mount">
          <div class="skeleton skeleton-line" style="margin-bottom:8px"></div>
          <div class="skeleton skeleton-line skeleton-line--med" style="margin-bottom:8px"></div>
          <div class="skeleton skeleton-line skeleton-line--short"></div>
        </div>
      </aside>

      <div>
        <div class="catalog-toolbar">
          <div style="font-size:13px;color:var(--text-secondary)" id="catalog-results-count">
            Searching live CS-Cart catalog...
          </div>

          <div class="catalog-toolbar-right">
            <label for="catalog-sort-select" style="font-size:12px;font-weight:600;color:var(--text-muted)">Sort:</label>
            <select id="catalog-sort-select" class="sort-select">
              <option value="position_asc">Best SKU / Keyword Match</option>
              <option value="discount_desc">Highest Trade Discount %</option>
              <option value="price_asc">Trade Price: Low to High</option>
              <option value="price_desc">Trade Price: High to Low</option>
              <option value="product_asc">Part Description: A to Z</option>
            </select>

            <div class="view-mode-toggle" role="group" aria-label="Switch Grid or BOM Table View">
              <button type="button" class="view-mode-btn is-active" data-view-mode="grid">
                <i data-lucide="layout-grid" data-lucide-size="14"></i>
                <span>Grid View</span>
              </button>
              <button type="button" class="view-mode-btn" data-view-mode="table">
                <i data-lucide="table-2" data-lucide-size="14"></i>
                <span>Trade Table (BOM)</span>
              </button>
            </div>
          </div>
        </div>

        <div class="product-grid" id="catalog-products-mount">
          <div class="skeleton-card"><div class="skeleton skeleton-img"></div><div class="skeleton skeleton-line"></div></div>
          <div class="skeleton-card"><div class="skeleton skeleton-img"></div><div class="skeleton skeleton-line"></div></div>
          <div class="skeleton-card"><div class="skeleton skeleton-img"></div><div class="skeleton skeleton-line"></div></div>
          <div class="skeleton-card"><div class="skeleton skeleton-img"></div><div class="skeleton skeleton-line"></div></div>
        </div>

        <div class="pagination-bar" id="catalog-pagination-mount"></div>
      </div>
    </section>
  </main>

  <!-- Global Footer -->
  <div id="site-shell-footer"></div>

  <script type="module" src="assets/js/pages/catalog.js"></script>
</body>
</html>
