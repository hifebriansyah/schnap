# Deploy the static SCHNAP pitch site (HTML pages + assets/) to GitHub Pages at schnap.situs.id
name: Deploy to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test
        run: |
          node test/frontend.test.mjs
          node --test test/worker.test.mjs
      - name: Collect the site files
        run: |
          mkdir _site
          cp *.html CNAME .nojekyll _site/
          cp -r assets _site/
      - name: Cache bust assets
        run: |
          node tools/cache-bust.mjs _site ${{ github.sha }}
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
